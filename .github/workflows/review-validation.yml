name: API review validation (no publication)
on:
  pull_request:
    branches: [main]
  push:
    branches: [overhaul/scoring-alignment-2026-11-16]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-review-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:1/validation
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-only
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --check
